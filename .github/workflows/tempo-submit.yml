# Weekly Tempo timesheet submit. Every Monday, GitHub Actions submits the timesheet
# for the last full week (Sunday to Saturday) to Tempo. It calls Tempo directly.
# The Waypoint app is not involved.
#
# Setup (repository → Settings → Secrets and variables → Actions):
# - Secret TEMPO_API_TOKEN   — the Tempo API token (Tempo → Settings → API integration)
# - Secret TEMPO_ACCOUNT_ID  — the Jira account ID of the person who owns the timesheet
# - Secret TEMPO_REVIEWER_ID — optional; the Jira account ID of the reviewer
#
# API: POST https://api.tempo.io/4/timesheet-approvals/user/{accountId}/submit
# (https://apidocs.tempo.io/v4/, operation "Submit Timesheet"). Query: from, to (yyyy-mm-dd).
# Body: comment and reviewerAccountId, both optional.
#
# The repository is public, so the job logs are public. GitHub masks secret values in
# the logs. The job prints only the HTTP status, the week, and the approval status.
name: Weekly Tempo submit

on:
  schedule:
    # Cron times are UTC: 03:30 UTC is 09:00 IST. GitHub can start a scheduled run late.
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      week_start:
        description: "First day (Sunday) of the week to submit, as YYYY-MM-DD. Leave empty for last week."
        required: false
        type: string
      dry_run:
        description: "Print the week and stop. Do not call Tempo."
        required: false
        type: boolean
        default: false

# The job only makes an outbound HTTP call, so it needs no repository permissions.
permissions: {}

concurrency:
  group: tempo-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit the timesheet for last week
        env:
          TEMPO_API_TOKEN: ${{ secrets.TEMPO_API_TOKEN }}
          TEMPO_ACCOUNT_ID: ${{ secrets.TEMPO_ACCOUNT_ID }}
          TEMPO_REVIEWER_ID: ${{ secrets.TEMPO_REVIEWER_ID }}
          WEEK_START_INPUT: ${{ inputs.week_start }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # Input handling: accept only a plain date, so no other text reaches the shell or the URL.
          if [ -n "$WEEK_START_INPUT" ]; then
            if ! [[ "$WEEK_START_INPUT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::week_start must have the format YYYY-MM-DD."
              exit 1
            fi
            from="$WEEK_START_INPUT"
          else
            # Tempo weeks start on Sunday. Go back to the Sunday that starts the current
            # week, then back 7 more days. On Monday 2026-11-23 this gives 2026-11-15.
            dow=$(date -u +%w)   # 0 = Sunday
            from=$(date -u -d "-$((dow + 7)) days" +%F)
          fi
          to=$(date -u -d "$from +6 days" +%F)
          echo "Week to submit: $from to $to"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run. No call to Tempo."
            exit 0
          fi

          if [ -z "$TEMPO_API_TOKEN" ] || [ -z "$TEMPO_ACCOUNT_ID" ]; then
            echo "::error::Set the TEMPO_API_TOKEN and TEMPO_ACCOUNT_ID secrets."
            exit 1
          fi

          # Build the JSON body with jq, so the values are always escaped.
          # An empty reviewer ID is left out, and Tempo uses its own default.
          body=$(jq -n --arg reviewer "$TEMPO_REVIEWER_ID" \
            '{comment: ""} + (if $reviewer != "" then {reviewerAccountId: $reviewer} else {} end)')

          status=$(curl -sS --max-time 60 -X POST -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer $TEMPO_API_TOKEN" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data "$body" \
            "https://api.tempo.io/4/timesheet-approvals/user/${TEMPO_ACCOUNT_ID}/submit?from=${from}&to=${to}")

          echo "HTTP status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            # Print the error message only, never the whole body.
            jq -r '"Tempo error: " + ((.errors // .message // "no message") | tostring)' response.json || true
            echo "::error::Tempo returned HTTP $status."
            exit 1
          fi

          jq '{status: .status.key, period}' response.json
