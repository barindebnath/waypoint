# Weekly Tempo timesheet submit. GitHub Actions calls the app's cron route; the route
# itself submits this week's timesheet (Sunday to Saturday) in Tempo for each opted-in user and checks CRON_SECRET.
# The Tempo API token, the Jira account ID and the reviewer come from each user's Settings.
#
# Setup (repository → Settings → Secrets and variables → Actions). These are the same
# values that the Weekly AutoTempo workflow uses:
# - Secret   CRON_SECRET  — the same value as CRON_SECRET in the Vercel project
# - Variable WAYPOINT_URL — the app URL, for example https://waypoint.example.com
#
# Each user turns on "Submit my Tempo timesheet every Saturday" in Settings.
#
# The repository is public, so the job logs are public. The job prints only the
# user counts and the HTTP status, never the response body or the secret.
name: Weekly Tempo submit

on:
  schedule:
    # Cron times are UTC: 03:30 UTC on Saturday is 09:00 IST. GitHub can start a scheduled run late.
    # The route submits the week that ends on Saturday, and a run on Sunday or Monday submits the same week.
    - cron: "30 3 * * 6"
  workflow_dispatch:

# The job only makes an outbound HTTP call, so it needs no repository permissions.
permissions: {}

concurrency:
  group: tempo-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the Tempo submit cron route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WAYPOINT_URL: ${{ vars.WAYPOINT_URL }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ] || [ -z "$WAYPOINT_URL" ]; then
            echo "::error::Set the CRON_SECRET secret and the WAYPOINT_URL variable."
            exit 1
          fi

          # The route can run for up to 120 s (maxDuration), so allow a little more here.
          status=$(curl -sS --max-time 150 -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${WAYPOINT_URL%/}/api/cron/tempo-submit")

          echo "HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::The Tempo submit cron route returned HTTP $status."
            exit 1
          fi

          jq '{usersProcessed, usersFailed}' response.json
          if [ "$(jq '.usersFailed' response.json)" != "0" ]; then
            echo "::error::The Tempo submit failed for one or more users. See the Vercel function logs."
            exit 1
          fi
